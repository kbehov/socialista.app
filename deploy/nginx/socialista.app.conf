# socialista.app — Next.js standalone (PM2 app socialista-web, 127.0.0.1:3000)
#
# Install (Debian/Ubuntu):
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx/snippets/*.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/socialista.app.conf /etc/nginx/sites-available/socialista.app.conf
#   sudo ln -sfn /etc/nginx/sites-available/socialista.app.conf /etc/nginx/sites-enabled/socialista.app.conf
#   # websocket map, once, before the site files:
#   echo 'include /etc/nginx/snippets/websocket-map.conf;' | sudo tee /etc/nginx/conf.d/socialista-map.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates (DNS must already point at this host):
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d socialista.app -d www.socialista.app
# Re-run nginx -t after the certs exist. The 443 servers fail closed until then.

upstream socialista_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name socialista.app www.socialista.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://socialista.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.socialista.app;

    ssl_certificate     /etc/letsencrypt/live/socialista.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socialista.app/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    ssl_trusted_certificate /etc/letsencrypt/live/socialista.app/chain.pem;
    include /etc/nginx/snippets/security-headers.conf;

    return 301 https://socialista.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name socialista.app;

    ssl_certificate     /etc/letsencrypt/live/socialista.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socialista.app/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    ssl_trusted_certificate /etc/letsencrypt/live/socialista.app/chain.pem;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 52m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # Optional, if the nginx-module-brotli package is installed:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location /_next/static/ {
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        expires 1y;
        proxy_pass http://socialista_web;
    }

    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://socialista_web;
    }
}
