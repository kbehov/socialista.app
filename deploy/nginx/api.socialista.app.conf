# api.socialista.app — Hono API (PM2 app socialista-api, 127.0.0.1:8080)
#
# Install (Debian/Ubuntu):
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx/snippets/*.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/api.socialista.app.conf /etc/nginx/sites-available/api.socialista.app.conf
#   sudo ln -sfn /etc/nginx/sites-available/api.socialista.app.conf /etc/nginx/sites-enabled/api.socialista.app.conf
#   echo 'include /etc/nginx/snippets/websocket-map.conf;' | sudo tee /etc/nginx/conf.d/socialista-map.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate:
#   sudo certbot certonly --webroot -w /var/www/certbot -d api.socialista.app
#
# limit_req_zone is http-context. This file must be included from http { }
# (sites-enabled on Debian/Ubuntu), not from inside another server block.
# Cron jobs call 127.0.0.1:8080 directly and never pass through this vhost.
# /cron/ is denied here so the secret header is not the only control.

limit_req_zone $binary_remote_addr zone=socialista_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=socialista_api_strict:10m rate=2r/s;
limit_req_status 429;

upstream socialista_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.socialista.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://api.socialista.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.socialista.app;

    ssl_certificate     /etc/letsencrypt/live/api.socialista.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.socialista.app/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    ssl_trusted_certificate /etc/letsencrypt/live/api.socialista.app/chain.pem;

    include /etc/nginx/snippets/security-headers.conf;

    # Video upload proxy and other large bodies. Web uploads are capped at 52m.
    client_max_body_size 256m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;

    location = /health {
        access_log off;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://socialista_api;
    }

    location ^~ /cron/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://socialista_api;
    }

    location /auth {
        limit_req zone=socialista_api_strict burst=8 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://socialista_api;
    }

    location /webhooks {
        limit_req zone=socialista_api_strict burst=5 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://socialista_api;
    }

    # Polar billing events: POST /workspaces/:id/billing/polar/events
    location ~ ^/workspaces/[^/]+/billing/ {
        limit_req zone=socialista_api_strict burst=5 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://socialista_api;
    }

    location / {
        limit_req zone=socialista_api burst=20 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://socialista_api;
    }
}
