# Include once in the http { } context (see the vhost install comments).
# Empty Connection keeps upstream keepalive; "upgrade" is used only when the
# client asked for a websocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Declared once. Repeating a shared zone from each server block makes nginx
# refuse to start when the sizes are re-stated.
ssl_session_timeout 1d;
ssl_session_cache shared:socialista_ssl:10m;
ssl_session_tickets off;
